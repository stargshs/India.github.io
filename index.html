        let currentFilter = 'all';
        let selectedStateQuery = '';

        function populateDropdown() {
            const selectEl = document.getElementById('state-select');
            regionsData.forEach(item => {
                const opt = document.createElement('option');
                opt.value = item.name;
                opt.className = "bg-black text-amber-200 py-2";
                opt.textContent = `${item.emoji} ${item.name} (${item.type})`;
                selectEl.appendChild(opt);
            });
        }

        function renderRegions() {
            const grid = document.getElementById('states-grid');
            const noResults = document.getElementById('no-results');

            const filtered = regionsData.filter(item => {
                const matchesFilter = currentFilter === 'all' || item.type === currentFilter;
                const matchesSelect = !selectedStateQuery || item.name === selectedStateQuery;
                return matchesFilter && matchesSelect;
            });

            if (filtered.length === 0) {
                grid.innerHTML = '';
                noResults.classList.remove('hidden');
                return;
            }

            noResults.classList.add('hidden');
            grid.innerHTML = filtered.map(item => {
                const isSelected = selectedStateQuery && item.name === selectedStateQuery;
                const highlightStyle = isSelected ? 'border-amber-400 ring-4 ring-amber-400/30 shadow-2xl scale-[1.02]' : '';

                return `
                <div class="avant-card rounded-3xl p-6 flex flex-col justify-between ${highlightStyle}">

                            <span class="px-3 py-1 rounded-full text-[11px] font-bold tracking-wider uppercase ${item.type === 'State' ? 'bg-amber-500/20 text-amber-300 border border-amber-500/40' : 'bg-emerald-500/20 text-emerald-300 border border-emerald-500/40'}">
                                ${item.type}
                            </span>
                        </div>
                        <h3 class="text-2xl font-bold mb-2 gold-gradient cinzel-font">${item.name}</h3>
                        <p class="text-amber-100/70 text-sm mb-6 leading-relaxed">${item.desc}</p>
                        
                        <div class="space-y-2 text-xs sm:text-sm border-t border-amber-500/20 pt-4">

                                <span class="font-bold w-24 text-amber-400/70 flex items-center shrink-0"><i class="fa-solid fa-crown mr-2 text-amber-400 text-xs"></i> Capital:</span>
                                <span class="font-semibold truncate">${item.capital}</span>
                            </div>
                            <div class="flex items-center text-amber-100">
                                <span class="font-bold w-24 text-amber-400/70 flex items-center shrink-0"><i class="fa-solid fa-language mr-2 text-amber-400 text-xs"></i> Language:</span>
                                <span class="font-semibold truncate">${item.language}</span>
                            </div>
                            <div class="flex items-center text-amber-100">
                                <span class="font-bold w-24 text-amber-400/70 flex items-center shrink-0"><i class="fa-solid fa-utensils mr-2 text-amber-400 text-xs"></i> Famous:</span>
                                <span class="font-semibold truncate">${item.dish}</span>
                            </div>
                        </div>
                    </div>
                    <div class="mt-6 pt-4 border-t border-amber-500/20 flex items-center justify-between text-xs text-amber-300/80">
                        <span class="truncate flex items-center mr-2"><i class="fa-solid fa-landmark text-amber-400 mr-2 shrink-0"></i> ${item.landmark}</span>
                        <button onclick="showToast('${item.name} capital is ${item.capital}! 🪷')" class="text-amber-400 hover:text-amber-300 shrink-0 font-bold uppercase tracking-wider">HUD Fact</button>
                    </div>
                </div>
            `;
            }).join('');
        }

        function filterType(type) {
            currentFilter = type;
            selectedStateQuery = '';
            document.getElementById('state-select').value = '';
            
            ['all', 'State', 'Union Territory'].forEach(t => {
                const btn = document.getElementById(`filter-${t}`);
                if(btn) {
                    if(t === type) {
                        btn.className = "px-4 py-2 rounded-lg text-xs font-bold bg-amber-400 text-black shadow transition-all";
                    } else {
                        btn.className = "px-4 py-2 rounded-lg text-xs font-bold text-amber-200 hover:bg-amber-500/10 transition-all";
                    }
                }
            });
            renderRegions();
        }

        const stateSelect = document.getElementById('state-select');
        stateSelect.addEventListener('change', (e) => {
            selectedStateQuery = e.target.value;
            renderRegions();

            if (selectedStateQuery) {
                const statesSection = document.getElementById('states-section');
                if (statesSection) {
                    statesSection.scrollIntoView({ behavior: 'smooth', block: 'start' });
                }
            }
        });

        const toast = document.getElementById('toast');
        const toastMessage = document.getElementById('toast-message');

        function showToast(message) {
            toastMessage.textContent = message;
            toast.classList.remove('translate-y-32', 'opacity-0');
            setTimeout(() => {
                toast.classList.add('translate-y-32', 'opacity-0');
            }, 3500);
        }

        window.onload = function() {
            populateDropdown();
            renderRegions();
        }
    </script>
</body>
</html>
